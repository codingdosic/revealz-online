# Full Spring test suite: unit tests plus PostgreSQL Testcontainers integration tests.
# Does not deploy or spawn Dedicated.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and DB integration tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test
